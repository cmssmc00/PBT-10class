name: conch_ihc_credit_206_10class
output_dir: outputs/pathology_credit
global_seed: 20260830

data:
  patients_json: data/patients_206.json
  data_root: data
  feature_key: features
  feature_dim: 768
  # Use all five POS/NEG values, including values marked italic/inferred in the
  # source workbook. ihc_mask is therefore [1, 1, 1, 1, 1] for every patient.
  ihc_policy: all
  exclude_tumor_flag_zero: false
  split_file: splits/pathology_5fold.json
  n_splits: 5
  # Relative to each outer fold's non-test pool (about 80% of the cohort), so
  # 0.125 gives about 10% of the full cohort for model selection.
  eval_fraction: 0.125
  split_seed: 20260830
  max_train_patches: 2048
  # 0 means use every patch for eval/test. Inference uses batch size 1.
  max_eval_patches: 0

model:
  projection_dim: 256
  attention_dim: 128
  ihc_hidden_dim: 32
  fusion_dim: 128
  patch_dropout: 0.1
  fusion_dropout: 0.2
  l2: 0.0001
  # Keep provenance/missingness flags out of the classifier input. With
  # ihc_policy=all, the runtime mask is constant and only performs multiplication.
  ihc_mask_as_feature: false
  teacher_use_ihc: true
  # Set false for the privileged-information experiment in which teachers see
  # IHC but the deployed CREDIT student is CONCH-only.
  student_use_ihc: true

training:
  # Same architecture and hyperparameters; fresh initialization per seed.
  teacher_seeds: [101, 102, 103, 104, 105]
  teacher_epochs: 100
  student_epochs: 100
  batch_size: 2
  eval_batch_size: 1
  teacher_learning_rate: 0.0003
  student_learning_rate: 0.0003
  distillation_temperature: 2.5
  patience: 15
  class_weighting: balanced
  gradient_clip_norm: 5.0
